schema_version: 1

context:
  version: "2.1.1"

package:
  name: pym4e
  version: ${{ version }}

source:
  url: https://github.com/Project-SEA-Stack/Python_Multibody_for_Everybody/archive/refs/tags/v${{ version }}.tar.gz
  sha256: d6fc1ea98bf86f80304dc10dc5062d86bf3e71d85c7da3cd57131b6e396d3f61

build:
  noarch: python
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=61

  run:
    - python >=${{ python_min }}
    - numpy
    - scipy
    - sympy
    - pandas <3
    - matplotlib-base
    - networkx
    - pyyaml
    - xarray
    - capytaine

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - multibody
      pip_check: true

about:
  homepage: https://github.com/Project-SEA-Stack/Python_Multibody_for_Everybody
  repository: https://github.com/Project-SEA-Stack/Python_Multibody_for_Everybody
  summary: Symbolic multibody dynamics framework for planar systems
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - AlvaroDFC
    - SabetNREL
